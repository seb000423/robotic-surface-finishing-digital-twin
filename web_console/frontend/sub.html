<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PolyTwin</title>
<meta name="description" content="PolyTwin — 로봇 폴리싱 공정 디지털 트윈. 공정 · 기술 · 안전 검증 · 가격 정책 · 팀.">
<meta name="theme-color" content="#08090B">
<link rel="icon" href="assets/favicon.svg">

<link rel="preload" href="assets/fonts/Pretendard-300.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Pretendard-500.subset.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/Pretendard-700.subset.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* ══ 폰트 — index.html 과 동일 ══ */
@font-face { font-family:"Pretendard"; font-weight:300; font-display:swap;
  src:url("assets/fonts/Pretendard-300.subset.woff2") format("woff2"); }
@font-face { font-family:"Pretendard"; font-weight:500; font-display:swap;
  src:url("assets/fonts/Pretendard-500.subset.woff2") format("woff2"); }
@font-face { font-family:"Pretendard"; font-weight:700; font-display:swap;
  src:url("assets/fonts/Pretendard-700.subset.woff2") format("woff2"); }
@font-face { font-family:"Pretendard Full"; font-weight:300; font-display:swap;
  src:url("assets/fonts/Pretendard-300.full-ko.woff2") format("woff2"); }
@font-face { font-family:"Pretendard Full"; font-weight:500; font-display:swap;
  src:url("assets/fonts/Pretendard-500.full-ko.woff2") format("woff2"); }
@font-face { font-family:"Pretendard Full"; font-weight:700; font-display:swap;
  src:url("assets/fonts/Pretendard-700.full-ko.woff2") format("woff2"); }

/* ══ 토큰 —*/
:root {
  --bg-void:   #08090B;
  --bg-void-ch: 8 9 11;
  --bg-base:   #0E1216;
  --bg-panel:  #14181D;
  --bg-raised: #1A1E24;
  --line:      #232830;
  --line-hi:   #3B424C;
  --text-hi:   #F2F4F7;
  --text-mid:  #A8B0BA;
  --text-lo:   #5F6873;
  --accent:     #9BC33A;
  --accent-dim: #59721A;
  --ok:   #3DD68C;
  --warn: #FFB74D;
  --crit: #E8232A;

  --f-sans: "Pretendard", "Pretendard Full", -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
  --r-sm: 2px;
  --r-md: 4px;
  --e-out: cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast: 120ms;
  --t-base: 200ms;
  --t-slow: 400ms;
  --header-h: 64px;
  --gutter: 24px;
}
@media (min-width: 768px)  { :root { --gutter: 40px; } }
@media (min-width: 1280px) { :root { --gutter: 64px; } }

*, *::before, *::after { box-sizing: border-box; }
html {
  -webkit-text-size-adjust: 100%;
  /* 메뉴를 열면 html 에 overflow:hidden 이 걸리면서 스크롤바가 사라진다.
     뷰포트가 그만큼 넓어지므로 가운데 정렬된 .mark 가 스크롤바 폭의 절반만큼
     오른쪽으로 튄다. 자리를 늘 비워 두면 열고 닫아도 로고가 움직이지 않는다. */
  scrollbar-gutter: stable;
}
body {
  margin: 0;
  background: var(--bg-void);
  color: var(--text-mid);
  font-family: var(--f-sans);
  font-weight: 300;
  font-size: 17px;
  line-height: 1.7;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, p, figure, ul { margin: 0; }
ul { padding: 0; list-style: none; }
img, svg { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
:where(a, button, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  border-radius: var(--r-sm);
}
.wrap { max-width: 1280px; margin: 0 auto; padding-inline: var(--gutter); }
.label {
  font-size: 14px; font-weight: 500; letter-spacing: 0.12em;
  text-transform: uppercase; line-height: 1.3; color: var(--text-lo);
}
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; font-weight: 500; }

.skip {
  position: absolute; left: var(--gutter); top: -100px; z-index: 1000;
  background: var(--bg-panel); color: var(--text-hi);
  border: 1px solid var(--line-hi); border-radius: var(--r-sm);
  padding: 12px 20px; font-size: 16px;
  transition: top var(--t-fast) var(--e-out);
}
.skip:focus { top: 12px; }

/* ══ 헤더 — 검은색. index.html 과 동일한 3분할 ══ */
.hdr {
  position: fixed; inset: 0 0 auto; z-index: 100;
  height: var(--header-h);
  background: var(--bg-void);
  border-bottom: 1px solid var(--line);
}
.hdr__in {
  height: 100%;
  padding-inline: clamp(16px, 2.2vw, 40px);
  display: grid; grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 16px; min-width: 0;
}
.mark {
  grid-column: 2; justify-self: center;
  display: inline-flex; align-items: center; gap: 12px;
  font-size: 20px; font-weight: 500; letter-spacing: 0.3em;
  color: var(--text-hi); text-transform: uppercase; white-space: nowrap;
  padding-block: 8px; padding-inline-start: 0.3em;
}
.mark b { font-weight: 700; color: var(--accent); }
/* 심벌 — 육각 두 면. 왼쪽 면은 바탕을 따라 뒤집히고(다크 = 흰색, 반전 = 검정),
   오른쪽 면은 어느 바탕에서나 브랜드 연두다. */
.mark__sig { flex: none; width: 40px; height: 24px; }
.mark__sig .a { fill: currentColor; }
.mark__sig .b { fill: var(--accent); }
.hdr__end { grid-column: 3; justify-self: end; display: flex; align-items: center; gap: 12px; min-width: 0; }
.lang { display: none; align-items: center; gap: 8px; font-size: 15px; font-weight: 500; letter-spacing: 0.06em; margin: 0; }
.lang span { color: var(--line-hi); }
.lang a { color: var(--text-lo); padding: 12px 2px; transition: color var(--t-fast) var(--e-out); }
.lang a[aria-current="true"] { color: var(--text-hi); }
@media (min-width: 768px) { .lang { display: flex; } }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 20px;
  font-family: inherit; font-size: 16px; font-weight: 500; letter-spacing: 0.04em;
  border-radius: var(--r-sm); cursor: pointer; white-space: nowrap;
  transition: background-color var(--t-fast) var(--e-out),
              border-color var(--t-fast) var(--e-out),
              color var(--t-fast) var(--e-out);
}
.btn--ghost { background: transparent; color: var(--text-hi); border: 1px solid var(--line-hi); }
.btn--ghost:hover { background: var(--bg-raised); border-color: var(--text-lo); }
.hdr__cta { display: none; letter-spacing: 0.1em; }
@media (min-width: 380px) { .hdr__cta { display: inline-flex; } }

.menu-btn {
  grid-column: 1; justify-self: start;
  display: inline-flex; align-items: center; justify-content: center;
  width: 44px; height: 44px; padding: 0; margin-inline-start: -10px;
  background: transparent; border: 0; border-radius: var(--r-sm);
  color: var(--text-hi); cursor: pointer;
  transition: background-color var(--t-fast) var(--e-out);
}
.menu-btn:hover { background: var(--bg-raised); }
.menu-btn .ico-x { display: none; }
[data-menu="open"] .menu-btn .ico-bars { display: none; }
[data-menu="open"] .menu-btn .ico-x { display: block; }

/* ══ 메뉴 오버레이 — index.html 과 동일한 반전 ══ */
.drawer {
  --hair: rgb(var(--bg-void-ch) / 0.14);
  position: fixed; inset: 0; z-index: 99;
  background: var(--text-hi);
  overflow-y: auto; overscroll-behavior: contain;
  animation: menuIn var(--t-base) var(--e-out);
}
@keyframes menuIn { from { opacity: 0; transform: translateY(-6px); } }
.drawer[hidden] { display: none; }
.drawer__in {
  max-width: 1280px; margin-inline: auto;
  min-height: 100dvh;
  padding: calc(var(--header-h) + 56px) var(--gutter) 56px;
  display: grid; gap: 56px;
}
@media (min-width: 900px) {
  .drawer__in { grid-template-columns: minmax(0, 1fr) minmax(0, 26rem); gap: 80px; }
}
.menu-col { display: grid; grid-template-rows: auto 1fr auto; }
.menu-main { display: grid; align-content: start; }
.menu-foot {
  align-self: end; padding-top: 40px;
  font-size: 15px; letter-spacing: 0.02em; color: var(--text-lo);
}
.m-group { border-bottom: 1px solid var(--hair); }
.m-group > summary {
  display: flex; align-items: center; gap: 14px;
  padding-block: 22px; cursor: pointer;
  list-style: none;
  font-size: clamp(22px, 3vw, 34px); font-weight: 700; line-height: 1.2;
  letter-spacing: -0.02em; color: var(--bg-void);
  /* SOLUTION·PR 은 원래 대문자다. 영어로 바뀌는 COMPANY·TECHNOLOGY 만
     소문자로 남으면 네 줄이 따로 논다. 한글은 대소문자가 없어
     한국어 화면은 이 규칙에 영향을 받지 않는다 */
  text-transform: uppercase;
  transition: color var(--t-fast) var(--e-out);
}
.m-group > summary::-webkit-details-marker { display: none; }
.m-group > summary:hover { color: var(--accent-dim); }
.m-chev {
  width: 18px; height: 18px; flex: none; color: var(--text-lo);
  transition: transform var(--t-base) var(--e-out);
}
.m-group[open] > summary .m-chev { transform: rotate(180deg); }
.m-sub { display: grid; padding-bottom: 18px; }
.m-sub a {
  padding: 11px 0 11px 2px;
  font-size: 21px; color: var(--text-lo);
  transition: color var(--t-fast) var(--e-out);
}
.m-sub a:hover { color: var(--bg-void); }
.m-sub a[aria-current="page"] { color: var(--bg-void); font-weight: 500; }
.m-group[open] > .m-sub { animation: subIn var(--t-base) var(--e-out); }
@keyframes subIn { from { opacity: 0; transform: translateY(-4px); } }

.menu-side { display: grid; align-content: start; gap: 12px; }
.menu-side h2 {
  font-size: 14px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-lo); margin-bottom: 4px;
}
.menu-card {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  min-height: 64px; padding: 0 18px;
  border: 1px solid var(--hair); border-radius: var(--r-md);
  font-size: 19px; font-weight: 500; color: var(--bg-void);
  transition: border-color var(--t-fast) var(--e-out),
              background-color var(--t-fast) var(--e-out);
}
.menu-card:hover { border-color: var(--text-lo); background: rgb(var(--bg-void-ch) / 0.04); }
.menu-card svg { width: 16px; height: 16px; color: var(--text-lo); flex: none; }

[data-menu="open"] .hdr { background: var(--text-hi); border-bottom-color: rgb(var(--bg-void-ch) / 0.14); }
[data-menu="open"] .mark { color: var(--bg-void); }
/* 로고는 반전면에서도 브랜드 원색을 쓴다. WCAG 1.4.3 은 로고타입을 대비
   요건에서 제외한다 — 흰 면 위 1.9:1 이지만 이건 글이 아니라 상표다.
   심벌만 원색으로 올리고 TWIN 을 내리면 두 초록이 어긋나 고장난 것처럼 보인다.
   로고 밖의 글자(대제목 hover, 역할 배지)는 그대로 --accent-dim 을 쓴다. */
[data-menu="open"] .mark b { color: var(--accent); }
[data-menu="open"] .mark__sig .b { fill: var(--accent); }
[data-menu="open"] .menu-btn { color: var(--bg-void); }
[data-menu="open"] .menu-btn:hover { background: rgb(var(--bg-void-ch) / 0.06); }
[data-menu="open"] .lang a { color: var(--text-lo); }
[data-menu="open"] .lang a[aria-current="true"] { color: var(--bg-void); }
[data-menu="open"] .lang span { color: rgb(var(--bg-void-ch) / 0.3); }
[data-menu="open"] .btn--ghost { color: var(--bg-void); border-color: rgb(var(--bg-void-ch) / 0.3); }
[data-menu="open"] .btn--ghost:hover { background: rgb(var(--bg-void-ch) / 0.06); }
[data-menu="open"] { overflow: hidden; }

/* ══ 페이지 머리 ══ */
main { padding-top: var(--header-h); }
.crumb {
  display: flex; align-items: center; gap: 10px;
  padding-top: 56px;
}
.crumb a { color: var(--text-lo); transition: color var(--t-fast) var(--e-out); }
.crumb a:hover { color: var(--text-mid); }
.crumb .sep { color: var(--line-hi); }
.page-head { padding-block: 20px clamp(48px, 7vh, 88px); display: grid; gap: 20px; }
.page-head h1 {
  font-size: clamp(30px, 4.6vw, 54px); font-weight: 700; line-height: 1.2;
  letter-spacing: -0.02em; color: var(--text-hi); text-wrap: balance;
  max-width: 24ch;
}
.page-head .lede { max-width: 56ch; font-size: clamp(16px, 1.7vw, 19px); color: var(--text-mid); text-wrap: pretty; }

/* ══ 프로세스 — 번호 붙은 교차 배치 ══ */
.proc { border-top: 1px solid var(--line); }
.p-step {
  display: grid; gap: 28px;
  padding-block: clamp(48px, 7vh, 80px);
  border-bottom: 1px solid var(--line);
  align-items: center;
}
@media (min-width: 900px) {
  .p-step { grid-template-columns: minmax(0, 30ch) minmax(0, 1fr); gap: clamp(48px, 6vw, 96px); }
  .p-step:nth-of-type(even) { grid-template-columns: minmax(0, 1fr) minmax(0, 30ch); }
  .p-step:nth-of-type(even) .p-txt { order: 2; }
}
.p-no {
  display: inline-flex; align-items: baseline; gap: 10px;
  margin-bottom: 14px;
}
.p-no b {
  font-size: 16px; font-weight: 700; letter-spacing: 0.08em;
  color: var(--accent); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
}
.p-txt { min-width: 0; }
.p-txt h2 {
  font-size: clamp(20px, 2.4vw, 27px); font-weight: 700; line-height: 1.35;
  letter-spacing: -0.01em; color: var(--text-hi); text-wrap: balance;
  margin-bottom: 12px;
}
.p-txt p { font-size: 17px; color: var(--text-mid); }
.p-txt ul { margin-top: 18px; display: grid; gap: 9px; }
.p-txt li { position: relative; padding-inline-start: 18px; font-size: 16px; color: var(--text-mid); }
/* ── 양쪽 정렬을 쓰지 않는다 ────────────────────────────────
   한때 30ch 좁은 단 문단 하나를 재서 "여백 15% 까지는 안 띈다" 로
   일반화했는데, 문장마다 줄당 어절 수가 달라 그 값이 다른 문단엔
   안 맞았다 (예: '시장과 결제 경로' 03단계, 짧은 어절이 줄 앞을
   차지하면 남는 공백이 몇 안 되는 자리에 몰려 들쭉날쭉해진다).
   keep-all + justify 조합은 어절 수가 적을수록 깨지므로, 문단마다
   재는 대신 그냥 양쪽 정렬을 쓰지 않는다. ── */

.p-txt li::before {
  content: ""; position: absolute; inset-inline-start: 0; top: 10px;
  width: 6px; height: 1px; background: var(--accent-dim);
}
.p-fig {
  min-width: 0;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--bg-panel); overflow: hidden;
}
/* 레터박스는 이미지 자체의 near-black 과 이어져야 한다.
   밝은 PPT 크롭을 쓰던 시절의 흰 배경이 여기 있었다 */
.p-fig img { width: 100%; height: auto; max-height: 460px; object-fit: contain; background: var(--bg-void); }
.p-fig figcaption {
  padding: 10px 14px; border-top: 1px solid var(--line);
  font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-lo); background: var(--bg-base);
}
/* 언어별 대문자 — 이 캡션은 낱말 라벨이 아니라 한 문장이다.
   uppercase 는 한글에 아무 일도 하지 않아서 한국어 화면은 처음부터
   평범한 결로 렌더됐다. 영문에서만 전 대문자가 되면서
   "PAINT CROSS-SECTION AND DAMAGE DEPTH — LAYER THICKNESSES ARE…" 같은
   120자짜리 대문자 덩어리가 됐다. 낱말 윤곽이 사라져 읽는 속도가 떨어진다.
   EN 에서 끄는 것이 한국어 화면과 결을 맞추는 쪽이다. */
html[lang="en"] .p-fig figcaption { text-transform: none; letter-spacing: 0.02em; }
/* 본문 폭을 다 쓰는 개요 도해 — 안의 글자가 작아서 높이를 더 준다 */
.p-fig.p-fig--wide img { max-height: min(72vh, 660px); }
/* 세로로 긴 그림은 띠 폭을 다 쓰면 좌우가 전부 여백이 된다.
   폭을 줄여 가운데 세운다 */
.p-fig.p-fig--tall { max-width: 560px; margin-inline: auto; }

/* 이미지가 아직 없는 단계 */
.p-fig .ph {
  aspect-ratio: 16 / 10; display: grid; place-content: center; gap: 8px;
  text-align: center; color: var(--text-lo); font-size: 16px;
  background:
    repeating-linear-gradient(-45deg, transparent 0 14px, rgb(var(--bg-void-ch) / 0.5) 14px 15px);
}

/* ══ 수치 스트립 ══ */
.stats { padding-block: clamp(48px, 7vh, 80px); }
.stats__grid {
  display: grid; gap: 1px; background: var(--line);
  border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden;
  grid-template-columns: repeat(2, minmax(0,1fr));
}
@media (min-width: 900px) { .stats__grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
.stats__grid > div { background: var(--bg-base); padding: 26px 20px; display: grid; gap: 8px; }
.stats__v {
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  font-size: clamp(26px, 3vw, 36px); font-weight: 300; line-height: 1;
  letter-spacing: -0.03em; color: var(--text-hi);
}
.stats__v small { font-size: 16px; font-weight: 500; color: var(--text-lo); margin-inline-start: 4px; letter-spacing: 0.04em; }

/* ══ 빈 상태 (PR) ══ */
.empty {
  margin-block: clamp(48px, 8vh, 96px);
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--bg-panel);
  padding: clamp(48px, 9vh, 110px) 24px;
  display: grid; place-items: center; gap: 14px; text-align: center;
}
.empty h2 { font-size: 20px; font-weight: 700; color: var(--text-hi); }
.empty p { font-size: 16px; color: var(--text-mid); max-width: 40ch; }

/* ══ 다음 페이지 이동 ══ */
.next {
  display: flex; flex-wrap: wrap; gap: 12px;
  padding-block: clamp(40px, 6vh, 64px) clamp(64px, 9vh, 110px);
}

/* ══ 푸터 ══ */
.ft { border-top: 1px solid var(--line); padding-block: 40px 48px; }
.ft__in { display: grid; gap: 24px; }
@media (min-width: 768px) { .ft__in { grid-template-columns: 1fr auto; align-items: center; } }
.ft small { color: var(--text-lo); font-size: 15px; }
.ft__links { display: flex; flex-wrap: wrap; gap: 4px; }
.ft__links a { padding: 10px 12px; font-size: 15px; color: var(--text-lo); transition: color var(--t-fast) var(--e-out); }
.ft__links a:hover { color: var(--text-mid); }

@media (prefers-reduced-motion: reduce) {
  .drawer, .m-group[open] > .m-sub { animation: none; }
  *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; }
}


.hdr__auth { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hdr__who { display: none; align-items: baseline; gap: 7px; font-size: 15px; color: var(--text-lo); min-width: 0; }
@media (min-width: 560px) { .hdr__who { display: flex; } }
.hdr__role {
  flex: none; padding: 2px 5px;
  border: 1px solid var(--accent-dim); border-radius: var(--r-sm);
  font-size: 13px; font-weight: 500; letter-spacing: 0.1em; color: var(--accent);
}
[data-menu="open"] .hdr__who { color: rgb(var(--bg-void-ch) / 0.45); }
[data-menu="open"] .hdr__role { color: var(--accent-dim); border-color: rgb(var(--bg-void-ch) / 0.3); }
/* ══════════════════════════════════════════════════════════════
   네이티브 도해 — 기획서 슬라이드 스크린샷을 대체한다
   래스터 크롭은 흰 판때기로 박히고, 폰트·팔레트가 다르고,
   텍스트가 픽셀로 구워져 있어 읽히지도 확대되지도 않았다.
   여기서는 같은 내용을 이 화면의 토큰으로 다시 그린다.
   ══════════════════════════════════════════════════════════════ */

/* 화면에서는 감추고 보조기술에는 남긴다 */
.sr {
  position: absolute; width: 1px; height: 1px;
  margin: -1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap;
}

.fg { padding: 20px; display: grid; gap: 14px; }
.fg__hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.fg__t { font-size: 16px; font-weight: 500; color: var(--text-hi); }
.fg__n { font-size: 14px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }

/* ── 계측 채널 ── 수치는 세로로 정렬되므로 tabular-nums 필수 ── */
.ch { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.ch__r {
  display: grid; grid-template-columns: minmax(88px, 1fr) minmax(0, 2.2fr) minmax(78px, auto);
  gap: 12px; align-items: center;
  padding: 9px 12px; background: var(--bg-base);
}
.ch__k { font-size: 15px; color: var(--text-mid); }
.ch__k small { display: block; font-size: 13px; letter-spacing: 0.08em; color: var(--text-lo); }
.ch__w { min-width: 0; }
.ch__w svg { display: block; width: 100%; height: 26px; color: var(--accent); }
.ch__v {
  text-align: right; font-size: 16px; color: var(--text-hi);
  font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1;
  white-space: nowrap;
}
.ch__v small { font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: var(--text-lo); margin-inline-start: 3px; }
.ch__sum {
  display: flex; align-items: baseline; gap: 8px;
  padding: 10px 12px; background: var(--bg-base);
}
.ch__sum b {
  font-size: 22px; font-weight: 300; letter-spacing: -0.03em; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.ch__sum span { font-size: 15px; color: var(--text-lo); }

/* ── 막대 차트 ── */
.bars svg { display: block; width: 100%; height: auto; }
.bars .grid { stroke: var(--line); stroke-width: 1; }
.bars .b-old { fill: var(--line-hi); }
.bars .b-new { fill: var(--accent); }
/* viewBox 를 렌더 폭에 맞췄으므로(배율 ≈ 1) 여기 px 가 곧 화면 px 다.
   라벨 11 · 값 13 — HTML 쪽과 같은 척도 */
.bars .t-ax { fill: var(--text-lo); font-size: 14px; letter-spacing: 0.02em; }
.bars .t-val { fill: var(--text-mid); font-size: 16px; font-variant-numeric: tabular-nums; }
.bars .t-val.is-hi { fill: var(--text-hi); }
.bars .t-d { fill: var(--text-lo); font-size: 14px; font-variant-numeric: tabular-nums; }
.bars .t-d.is-up { fill: var(--warn); }
.lg { display: flex; gap: 14px; font-size: 14px; color: var(--text-lo); }
.lg i { display: inline-block; width: 9px; height: 9px; margin-inline-end: 5px; border-radius: var(--r-sm); }
.lg .k-old { background: var(--line-hi); }
.lg .k-new { background: var(--accent); }
.lg .k-tgt { background: var(--warn); }

/* ── 세대 비교 ── 3열 균등 카드가 아니라 세로로 쌓는 비교다 ── */
.gen { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.gen__r {
  display: grid; gap: 4px;
  padding: 13px 14px; background: var(--bg-base);
  border-inline-start: 2px solid var(--line-hi);
}
.gen__r.is-open { border-inline-start-color: var(--accent); background: var(--bg-panel); }
.gen__hd { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.gen__no {
  font-size: 13px; font-weight: 500; letter-spacing: 0.12em; color: var(--text-lo);
  font-variant-numeric: tabular-nums;
}
.gen__t { font-size: 16px; font-weight: 500; color: var(--text-hi); }
.gen__d { font-size: 16px; color: var(--text-lo); }
.gen__o { margin-top: 3px; font-size: 16px; color: var(--text-mid); }
.gen__o b { color: var(--text-hi); font-weight: 500; font-variant-numeric: tabular-nums; }
.gen__r.is-open .gen__o b { color: var(--accent); }
/* 상태는 색만으로 알리지 않는다 — 점 + 글자 */
.st {
  margin-inline-start: auto; display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 6px; border: 1px solid var(--line-hi); border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500; letter-spacing: 0.06em; white-space: nowrap;
}
.st::before { content: ""; width: 4px; height: 4px; background: currentColor; }
.st.s-done { color: var(--ok); }
.st.s-open { color: var(--warn); border-color: var(--warn); }

/* ── 공정 범위 ── 숙련공 6단계 중 시스템이 맡는 구간을 표시한다 ── */
.frame { padding-block: clamp(32px, 5vh, 56px); display: grid; gap: 24px; }
.sc { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.sc__r {
  display: grid; grid-template-columns: 26px minmax(0, 13ch) minmax(0, 1fr) auto;
  gap: 14px; align-items: baseline;
  padding: 12px 14px; background: var(--bg-base);
  border-inline-start: 2px solid transparent;
}
/* 자동화 구간만 액센트. 나머지는 사람의 손으로 남는다 */
.sc__r.is-auto { border-inline-start-color: var(--accent); background: var(--bg-panel); }
.sc__no {
  font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-lo);
  font-variant-numeric: tabular-nums;
}
.sc__r.is-auto .sc__no { color: var(--accent); }
.sc__t { font-size: 16px; font-weight: 500; color: var(--text-mid); word-break: keep-all; }
.sc__r.is-auto .sc__t { color: var(--text-hi); }
.sc__d { font-size: 16px; color: var(--text-lo); word-break: keep-all; }
.sc__sum { display: flex; align-items: baseline; gap: 9px; padding: 12px 14px; background: var(--bg-base); }
.sc__sum b {
  font-size: 22px; font-weight: 300; letter-spacing: -0.03em; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.sc__sum b small { font-size: 16px; color: var(--accent-dim); }
.sc__sum span { font-size: 15px; color: var(--text-lo); word-break: keep-all; }
@media (max-width: 720px) {
  .sc__r { grid-template-columns: 26px minmax(0, 1fr) auto; row-gap: 5px; }
  .sc__d { grid-column: 2 / -1; }
  /* 칩은 제목 옆에 붙인다 — 맨 아래 왼쪽으로 흘러내리면 어느 행인지 안 보인다 */
  .sc__r > .st { grid-column: 3; grid-row: 1; }
}
/* 담당 칩 — 점 + 글자. 색만으로 알리지 않는다 */
.st.s-man { color: var(--text-lo); border-color: var(--line-hi); }
.st.s-sys { color: var(--accent); border-color: var(--accent); }

/*   이 페이지의 다른 도해는 전부 정지한 SVG·마크업이다. 여기만 실물
   모델을 띄우는 이유는 "물리를 다룬다"가 정지 그림으로는 증명되지
   않기 때문이다. 캔버스 높이는 고정하지 않고 비율로 묶는다 —
   높이를 px 로 박으면 좁은 화면에서 로봇이 잘린다. */
.rb { display: grid; gap: 12px; }
.rb__stage {
  position: relative; aspect-ratio: 4 / 3;
  background: var(--bg-void); border: 1px solid var(--line);
  overflow: hidden;
}
@media (min-width: 640px) { .rb__stage { aspect-ratio: 16 / 10; } }
.rb__stage canvas { display: block; width: 100%; height: 100%; }
/* 로드 전·실패 시 자리를 지키는 글자. 캔버스가 뜨면 JS 가 지운다 */
.rb__ph {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 6px;
  text-align: center; color: var(--text-lo); font-size: 15px;
}
.rb__ph b { color: var(--text-mid); font-weight: 500; font-size: 16px; }
/* 계측값 띠 — 로봇 아래에 붙여 3D 가 장식이 아님을 알린다 */
.rb__hud {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px;
  background: var(--line); border: 1px solid var(--line);
}
@media (min-width: 560px) { .rb__hud { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.rb__hud > div { background: var(--bg-base); padding: 10px 14px; display: grid; gap: 3px; }
.rb__v {
  font-size: 20px; font-weight: 300; line-height: 1; letter-spacing: -0.02em;
  color: var(--text-hi); font-variant-numeric: tabular-nums;
}
.rb__v small { font-size: 14px; font-weight: 500; color: var(--text-lo); margin-inline-start: 4px; }
.rb__k { font-size: 14px; color: var(--text-lo); word-break: keep-all; }

/* ── 정책 정합 ── 공고가 요구하는 것과 우리가 이미 가진 것을 마주 세운다 ──
   좌: 정책이 내건 조건 / 우: 우리가 대는 근거. 가운데 선이 대응을 만든다.
   두 칸을 같은 격자에 두는 이유는 눈이 가로로 짝을 지어 읽게 하기 위해서다 */
.pf { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.pf__hd, .pf__r {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 1px; background: var(--line);
}
.pf__hd > *, .pf__r > * { background: var(--bg-base); padding: 12px 14px; }
.pf__hd > * {
  background: var(--bg-panel);
  font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-lo);
}
/* 우리 쪽 칸만 액센트로 두른다 — 대응의 방향을 색이 알린다 */
.pf__r > :last-child { border-inline-start: 2px solid var(--accent); background: var(--bg-panel); }
.pf__k { font-size: 16px; font-weight: 500; color: var(--text-mid); word-break: keep-all; }
.pf__r > :last-child .pf__k { color: var(--text-hi); }
.pf__d { margin-top: 3px; font-size: 15px; color: var(--text-lo); word-break: keep-all; }
.pf__n {
  font-size: 15px; color: var(--text-lo); font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}
.pf__n b { color: var(--text-hi); font-weight: 500; }
/* 합계 줄 — 겹치는 지점이 몇 개인지 세어 준다 */
.pf__sum { display: flex; align-items: baseline; gap: 9px; padding: 12px 14px; background: var(--bg-base); }
.pf__sum b {
  font-size: 22px; font-weight: 300; letter-spacing: -0.03em; color: var(--accent);
  font-variant-numeric: tabular-nums;
}
.pf__sum span { font-size: 15px; color: var(--text-lo); word-break: keep-all; }
@media (max-width: 720px) {
  /* 좁아지면 짝을 세로로 쌓는다. 우리 쪽 칸의 왼쪽 선이 짝의 아래쪽임을 알린다 */
  .pf__hd { display: none; }
  .pf__r { grid-template-columns: minmax(0, 1fr); }
}

/* ── 도장면 단면 ── 연마가 되돌릴 수 있는 층은 하나뿐이다 ── */
.pl { display: grid; gap: 12px; }
.pl svg { display: block; width: 100%; height: auto; }
.pl .s-clear  { fill: var(--bg-raised); }
.pl .s-base   { fill: var(--line); }
.pl .s-primer { fill: var(--bg-base); }
.pl .s-panel  { fill: var(--line-hi); }
/* 연마 대상 층만 액센트로 두른다 — 나머지는 값 차이로만 구분한다 */
.pl .s-clear.is-t { stroke: var(--accent); stroke-width: 1; }
.pl .surf { stroke: var(--text-lo); stroke-width: 1; }
/* 패인 자국. 도형 배경색으로 메워 실제로 파낸 것처럼 읽힌다 */
.pl .cut { fill: var(--bg-panel); stroke-width: 1.5; stroke-linejoin: round; }
.pl .lead { stroke-width: 1; }
.pl .cut.d1, .pl .lead.d1 { stroke: var(--ok); }
.pl .cut.d2, .pl .lead.d2 { stroke: var(--warn); }
.pl .cut.d3, .pl .lead.d3 { stroke: var(--crit); }
.pl .t-n {
  font-size: 14px; font-weight: 500; letter-spacing: 0.02em;
  font-variant-numeric: tabular-nums;
}
.pl .t-n.d1 { fill: var(--ok); }
.pl .t-n.d2 { fill: var(--warn); }
.pl .t-n.d3 { fill: var(--crit); }
.pl .t-l { fill: var(--text-mid); font-size: 16px; }
.pl .t-s { fill: var(--text-lo); font-size: 14px; }
.pl .t-l.is-t, .pl .t-s.is-t { fill: var(--accent); }

.pl__v { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.pl__v > div {
  display: grid; grid-template-columns: 24px minmax(0, 1fr) auto;
  gap: 10px; align-items: center;
  padding: 9px 12px; background: var(--bg-base);
}
.pl__no {
  font-size: 13px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-lo);
  font-variant-numeric: tabular-nums;
}
.pl__t { font-size: 16px; color: var(--text-mid); word-break: keep-all; }
.pl__t small { display: block; font-size: 13px; color: var(--text-lo); }
/* 판정 칩 — 색만으로 알리지 않는다. .st 규칙을 그대로 쓴다 */
.st.s-part { color: var(--warn); border-color: var(--warn); }
.st.s-no   { color: var(--crit); border-color: var(--crit); }

/* ── 파이프라인 ── */
.flow { display: grid; }
.flow__r {
  display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px;
  padding-block: 9px; position: relative;
}
/* 단계를 잇는 선. 마지막 칸은 잇지 않는다 */
.flow__r:not(:last-child)::before {
  content: ""; position: absolute; inset-inline-start: 14px; top: 30px; bottom: -2px;
  width: 1px; background: var(--line);
}
.flow__n {
  width: 29px; height: 22px; display: grid; place-content: center;
  border: 1px solid var(--line-hi); border-radius: var(--r-sm);
  font-size: 14px; font-weight: 500; color: var(--text-lo);
  font-variant-numeric: tabular-nums; background: var(--bg-panel);
}
.flow__r.is-key .flow__n { border-color: var(--accent-dim); color: var(--accent); }
.flow__t { font-size: 16px; font-weight: 500; color: var(--text-hi); }
.flow__d { margin-top: 2px; font-size: 16px; color: var(--text-lo); }
.flow__env {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 9px 12px; margin-bottom: 4px;
  border: 1px solid var(--line); background: var(--bg-base);
  font-size: 14px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-lo);
}
.flow__env b { color: var(--text-mid); font-weight: 500; }

/* ── 사이클 구간 점유 ── 간트. 라벨 열 + 공용 시간축 한 벌 ── */
.gantt { display: grid; grid-template-columns: 72px minmax(0, 1fr); align-items: center; }
/* 라벨 열은 한글 4–5자(63px)에 맞춘 폭이다. 영문은 Transfer 59px,
   Set down 67px 로 72px 안에서 여유가 2px 도 안 남는다 — 조금만
   흔들려도 두 줄로 접히고 그 행만 두 배로 커진다. EN 에서 열을 넓힌다. */
html[lang="en"] .gantt { grid-template-columns: 88px minmax(0, 1fr); }
.gantt__l {
  font-size: 16px; color: var(--text-mid); text-align: end;
  word-break: keep-all; padding-inline-end: 2px;
}
.gantt__tr {
  height: 24px; display: flex; align-items: center;
  border-inline-start: 1px solid var(--line-hi);
}
.gantt__b { height: 10px; background: var(--accent-dim); border-radius: var(--r-sm); }
.gantt__b.is-bn { background: var(--warn); }
.gantt__ax {
  grid-column: 2; height: 1px; background: var(--line);
  margin-block-start: 4px;
}
.gantt__cap {
  grid-column: 1 / -1; margin-block-start: 12px; padding-block-start: 10px;
  border-block-start: 1px solid var(--line);
  font-size: 15px; color: var(--text-lo); word-break: keep-all;
}
.gantt__cap b { color: var(--warn); font-weight: 500; }

/* ── 리드 영상 ── 공정을 말로 설명하기 전에 한 번 보여준다 ── */
.lead {
  margin-block: 4px 8px;
  border: 1px solid var(--line); border-radius: var(--r-md);
  background: var(--bg-panel); overflow: hidden;
}
.lead video {
  display: block; width: 100%; height: auto;
  aspect-ratio: 16 / 9; max-height: 62vh; object-fit: contain;
  background: var(--bg-void);
}
.lead figcaption {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-top: 1px solid var(--line); background: var(--bg-base);
  font-size: 16px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--text-lo);
}
/* 위 .p-fig figcaption 과 같은 이유 — 영상 캡션도 한 문장이다 */
html[lang="en"] .lead figcaption { text-transform: none; letter-spacing: 0.02em; }
.lead figcaption b { color: var(--text-mid); font-weight: 500; }
.lead figcaption span { font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }

/* ── 영상 크롭 ── 화면 녹화에 같이 찍힌 앱 UI를 재인코딩 없이 잘라낸다.
   남길 영역으로 비율을 잡고 영상을 그만큼 키워 밀어넣는다.
   퍼센트는 컨테이너 기준이라 어떤 폭에서도 같은 자리가 잘린다.
   (top/left 의 % 는 각각 높이/폭에 걸린다 — 변수도 그 기준으로 계산한다) */
.vcrop {
  position: relative; overflow: hidden;
  display: block; width: 100%;
  background: var(--bg-void);
}
.vcrop video {
  position: absolute; top: var(--vy); left: var(--vx);
  width: var(--vw); height: var(--vh);
  display: block; max-height: none; aspect-ratio: auto; object-fit: fill;
  background: var(--bg-void);
}

/* ── 영상 ── 흰 배경을 깔지 않는다. 이미지와 달리 레터박스가 배경으로 읽힌다 */
.p-fig video {
  display: block; width: 100%; height: auto;
  aspect-ratio: 16 / 9;          /* 자리를 미리 잡아 레이아웃이 밀리지 않게 */
  max-height: 460px; object-fit: contain;
  background: var(--bg-void);
}

@media (max-width: 560px) {
  .fg { padding: 14px; }
  .ch__r { grid-template-columns: minmax(0, 1fr) minmax(70px, auto); }
  .ch__w { grid-column: 1 / -1; order: 3; }
}

/* ── 크롭 영상이 .p-fig 안에 올 때 ── 위의 .p-fig video 가 .vcrop video 보다
   뒤에 선언돼 기하 속성을 도로 덮는다. 여기서 다시 크롭 기하로 되돌린다 ── */
.p-fig .vcrop video {
  position: absolute; top: var(--vy); left: var(--vx);
  width: var(--vw); height: var(--vh);
  max-height: none; aspect-ratio: auto; object-fit: fill;
}

/* ── 비교 행 ── 기존 방식 vs 폴리트윈. 3열 균등 카드가 아니라 행 대조다 ── */
.cmp { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cmp__h, .cmp__r {
  display: grid; grid-template-columns: minmax(88px, 0.7fr) minmax(0, 1fr) minmax(0, 1.15fr);
  gap: 14px; padding: 11px 13px; background: var(--bg-base);
}
.cmp__h { background: var(--bg-panel); padding-block: 8px; }
.cmp__h span { font-size: 14px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-lo); }
.cmp__k { font-size: 15px; font-weight: 500; color: var(--text-hi); word-break: keep-all; }
.cmp__a { font-size: 16px; color: var(--text-lo); word-break: keep-all; }
.cmp__b { font-size: 16px; color: var(--text-mid); word-break: keep-all; border-inline-start: 2px solid var(--accent-dim); padding-inline-start: 10px; }
.cmp__b b { color: var(--accent); font-weight: 500; font-variant-numeric: tabular-nums; }
@media (max-width: 640px) {
  .cmp__h { display: none; }
  .cmp__r { grid-template-columns: minmax(0, 1fr); gap: 6px; }
}

/* ── 계측 요약 행 ── 라벨 · 산출 근거 · 값. 값은 mono 결이 아니라도 tabular ── */
.cal { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); }
.cal__r {
  display: grid; grid-template-columns: minmax(88px, 0.8fr) minmax(0, 1.4fr) minmax(92px, auto);
  gap: 12px; align-items: baseline; padding: 9px 12px; background: var(--bg-base);
}
.cal__k { font-size: 16px; font-weight: 500; color: var(--text-mid); word-break: keep-all; }
.cal__d { font-size: 15px; color: var(--text-lo); word-break: keep-all; }
.cal__v { font-size: 16px; color: var(--text-hi); text-align: end; font-variant-numeric: tabular-nums; }
.cal__r.is-sum { background: var(--bg-panel); border-inline-start: 2px solid var(--accent); }
.cal__r.is-sum .cal__v { color: var(--accent); font-size: 16px; font-weight: 500; }
@media (max-width: 560px) {
  .cal__r { grid-template-columns: minmax(0, 1fr) minmax(80px, auto); }
  .cal__d { grid-column: 1 / -1; order: 3; }
}

/* ── ISO 대역 도해 ── */
.iso svg { display: block; width: 100%; height: auto; }
.iso .ax { stroke: var(--line-hi); stroke-width: 1; }
.iso .band { fill: var(--accent-dim); }
.iso .tgt { stroke: var(--accent); stroke-width: 1.5; }
.iso .lim { stroke: var(--crit); stroke-width: 1.5; }
.iso text { fill: var(--text-lo); font-size: 14px; font-variant-numeric: tabular-nums; }
.iso .t-acc { fill: var(--accent); font-size: 14px; }
.iso .t-crit { fill: var(--crit); font-size: 14px; }

/* ══ 아래 넷은 기획서 크롭을 네이티브로 옮기며 추가했다 ══
   표를 그림으로 넣으면 글자가 선택도 검색도 안 되고, 스크린리더가 못 읽고,
   모바일에서 통째로 줄어든다. 표는 표로 그린다. ── */

/* ── 데이터 표 ── 깊이는 그림자가 아니라 선이다 ── */
.tbw { overflow-x: auto; }
.tb { width: 100%; border-collapse: collapse; border: 1px solid var(--line); }
.tb caption {
  text-align: start; padding-bottom: 7px;
  font-size: 15px; color: var(--text-lo); word-break: keep-all;
}
.tb th, .tb td {
  padding: 8px 12px; text-align: start; font-size: 16px;
  border-bottom: 1px solid var(--line); background: var(--bg-base); white-space: nowrap;
}
.tb thead th {
  background: var(--bg-panel); color: var(--text-lo);
  font-size: 14px; font-weight: 500; letter-spacing: 0.08em;
}
.tb tbody th { font-weight: 500; color: var(--text-mid); }
.tb tbody td { color: var(--text-mid); }
/* 자릿수가 흔들리면 계측 화면이 아니다 */
.tb .n { text-align: end; font-variant-numeric: tabular-nums; color: var(--text-hi); }
.tb .c { text-align: center; }
.tb tbody tr:last-child > * { border-bottom: 0; }
.tb .s-ok { color: var(--ok); }
.tb .s-no { color: var(--crit); }
.tb .s-warn { color: var(--warn); }

/* ── 판정 표시 ── 색만으로 알리지 않는다. 점 + 글자.
   체크 기호(U+2713)·빈 원(U+25CB)은 Pretendard 서브셋 928자에 없다.
   글리프를 늘리는 대신 점을 CSS 로 그린다 — 폰트가 커지지 않는다 ── */
.gr { display: inline-flex; align-items: center; gap: 6px; font-size: 15px; white-space: nowrap; }
.gr::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.gr.is-y { color: var(--accent); }
.gr.is-n { color: var(--text-lo); }
.gr.is-n::before { background: none; box-shadow: inset 0 0 0 1px currentColor; }
.gr.is-w { color: var(--warn); }
.gr.is-w::before { background: none; box-shadow: inset 0 0 0 1px currentColor; }

/* ── 곱셈 조합 ── 3종 × 4단계 × 4단계 = 48 ── */
.mul { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; }
.mul__op { align-self: center; font-size: 16px; color: var(--text-lo); }
.mul__c { flex: 1 1 128px; min-width: 0; display: grid; gap: 6px; align-content: start; }
.mul__h { display: grid; gap: 1px; }
.mul__n { font-size: 16px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.mul__k { font-size: 15px; color: var(--text-lo); word-break: keep-all; }
.mul__v {
  padding: 6px 9px; background: var(--bg-base); border: 1px solid var(--line);
  font-size: 16px; color: var(--text-mid); font-variant-numeric: tabular-nums;
}
.mul__c.is-sum .mul__v { border-color: var(--accent-dim); background: var(--bg-panel); color: var(--text-hi); }
.dots { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 8px 9px; }
.dots i { width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }

/* ── 학습 순환 ── 정책과 환경이 상태·보상으로 되돌아온다 ── */
.rl { display: grid; gap: 9px; }
.rl__row { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: stretch; }
.rl__b { padding: 11px 13px; background: var(--bg-base); border: 1px solid var(--line); display: grid; gap: 2px; }
.rl__b.is-key { border-color: var(--accent-dim); background: var(--bg-panel); }
.rl__t { font-size: 16px; font-weight: 500; color: var(--text-hi); }
.rl__s { font-size: 14px; color: var(--text-lo); font-variant-numeric: tabular-nums; }
.rl__ar { align-self: center; font-size: 15px; color: var(--text-lo); }
.rl__back {
  padding: 2px 0 6px; font-size: 14px; color: var(--text-lo); text-align: center;
}
.rl__eq {
  padding: 11px 13px; background: var(--bg-base); border: 1px solid var(--line);
  font-size: 16px; color: var(--text-mid); word-break: keep-all;
}
.rl__eq b { color: var(--accent); font-weight: 500; }
.rl__curve { display: grid; gap: 10px; padding: 11px 13px; background: var(--bg-base); border: 1px solid var(--line); }
.rl__curve svg { display: block; width: 100%; height: 56px; }
.rl__curve .ln { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.rl__curve .fl { fill: var(--accent-dim); opacity: 0.28; }
.rl__curve p { font-size: 15px; color: var(--text-lo); word-break: keep-all; }

/* ── 그림 위 라벨 ── 렌더는 그대로 두고 글자만 마크업으로 얹는다.
   그림에 구운 글자는 선택도 번역도 안 되지만, 이건 텍스트로 남는다.
   위치는 원본 픽셀에서 실측한 퍼센트다 — 눈대중 금지 ── */
/* .p-fig img 의 max-height 460px + object-fit:contain 을 그대로 두면 그림이
   레터박스가 되고, 그러면 퍼센트로 잡은 라벨이 엉뚱한 자리에 붙는다.
   상자를 그림 비율로 묶어 상자 = 그림이 되게 한다 (max-width 는 인라인) */
.ov { position: relative; margin-inline: auto; line-height: 0; }
.p-fig .ov img { display: block; width: 100%; height: auto; max-height: none; object-fit: fill; }
.ov__l {
  position: absolute; transform: translate(-50%, -50%);
  padding: 2px 7px; border: 1px solid var(--line-hi); border-radius: var(--r-sm);
  background: rgb(var(--bg-void-ch) / 0.74);
  font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--text-hi);
  white-space: nowrap; pointer-events: none;
}
.ov__l.is-warn { color: var(--warn); border-color: var(--warn); }
@media (max-width: 560px) { .ov__l { font-size: 13px; padding: 1px 5px; } }

/* ── 게시물 목록 ── News · Blog ── */
.posts { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-block: clamp(24px, 4vh, 44px); }
.post { display: grid; gap: 7px; padding: 20px 18px; background: var(--bg-base); }
.post time { font-size: 14px; font-weight: 500; letter-spacing: 0.08em; color: var(--text-lo); font-variant-numeric: tabular-nums; }
.post h2 { font-size: 17px; font-weight: 700; color: var(--text-hi); word-break: keep-all; }
.post p { font-size: 16px; line-height: 1.65; color: var(--text-mid); max-width: 74ch; word-break: keep-all; }

/* ── 문답 ── */
.qa { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); margin-block: clamp(24px, 4vh, 44px); }
.qa details { background: var(--bg-base); }
.qa details[open] { background: var(--bg-panel); }
.qa summary {
  cursor: pointer; list-style: none;
  display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 11px;
  padding: 14px 16px; font-size: 16px; font-weight: 500; color: var(--text-hi); word-break: keep-all;
}
.qa summary::-webkit-details-marker { display: none; }
.qa summary::before { content: "Q"; color: var(--accent); font-weight: 700; }
.qa summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qa__a { padding: 0 16px 16px 47px; font-size: 16px; line-height: 1.65; color: var(--text-mid); max-width: 74ch; word-break: keep-all; }

/* 언어별 본문 폭 — ch 는 숫자 0 의 폭이라 두 언어에서 같은 px 를 낸다.
   Pretendard 16px 기준 74ch = 688px 이고, 그 안에 들어가는 글자 수는
   한글 46자 / 영문 96자다. 한글은 적정 구간이고 영문은 두 배 가까이
   길다 — 줄 끝에서 다음 줄 앞을 못 찾는 폭이다.
   영문만 58ch(≈75자)로 줄인다. 글의 내용은 건드리지 않는다. */
html[lang="en"] .post p,
html[lang="en"] .qa__a { max-width: 58ch; }

/* 양쪽 정렬은 한국어에만. 한글은 어절이 짧고 글자가 고정폭이라
   남는 폭이 공백 몇 개에 고르게 흡수되지만, 영문은 낱말 길이 편차가
   커서 — 특히 30ch(영문 39자)짜리 좁은 단에서 — 한 줄에 공백이
   대여섯 개뿐이라 줄마다 크게 벌어지고 세로로 흰 강이 생긴다.
   영문 본문은 왼쪽 맞춤 그대로 둔다. */
html[lang="en"] .p-txt p,
html[lang="en"] .p-txt li,
html[lang="en"] .post p,
html[lang="en"] .qa__a,
html[lang="en"] .page-head .lede { text-align: start; }
</style>

<script>
/* ══ 메뉴 오버레이 — index.html 과 동일 동작 ══ */
(function () {
  const btn = document.getElementById('menuBtn');
  const drawer = document.getElementById('drawer');
  const setOpen = (open) => {
    const root = document.documentElement;
    drawer.hidden = !open;
    if (open) root.setAttribute('data-menu', 'open');
    else root.removeAttribute('data-menu');
    btn.setAttribute('aria-expanded', String(open));
    btn.setAttribute('aria-label', open ? '메뉴 닫기' : '메뉴 열기');
    if (open) drawer.querySelector('summary, a')?.focus();
  };
  btn.addEventListener('click', () => setOpen(drawer.hidden));
  drawer.addEventListener('click', (e) => { if (e.target.closest('a')) setOpen(false); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !drawer.hidden) { setOpen(false); btn.focus(); } });
  const groups = drawer.querySelectorAll('.m-group');
  groups.forEach((d) => d.addEventListener('toggle', () => {
    if (!d.open) return;
    groups.forEach((o) => { if (o !== d) o.open = false; });
  }));
})();

/* ══ 페이지 내용 ══
   수치는 CACADACA 기획서(2026-08)에 있는 값만 쓴다.

/* 결정적 난수 — 새로고침마다 파형이 달라지면 계측 화면이 아니다 */
function lcg(seed) {
  let s = seed >>> 0;
  return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296);
}

/* 폭 200 · 높이 26 좌표계의 폴리라인. 실제 크기는 CSS 가 정한다 */
function spark(kind, seed) {
  const N = 116, W = 200, H = 26, PAD = 3;
  const r = lcg(seed);
  const v = [];
  let hold = 0, cur = 0.5;

  for (let i = 0; i < N; i++) {
    const x = i / (N - 1);
    if (kind === 'square') {
      /* 접촉 구간과 이탈 구간이 번갈아 나오는 접촉력 */
      if (hold <= 0) { cur = r() < 0.45 ? 0.14 + r() * 0.1 : 0.72 + r() * 0.2; hold = 1 + Math.floor(r() * 6); }
      hold -= 1;
      v.push(cur);
    } else if (kind === 'spike') {
      /* 대체로 일정하다가 가끔 튀는 이송속도 */
      v.push(r() < 0.14 ? 0.62 + r() * 0.36 : 0.2 + r() * 0.14);
    } else if (kind === 'wave') {
      /* 곡면을 따라 완만하게 도는 공구 자세 */
      v.push(0.5 + 0.3 * Math.sin(x * 11) + 0.13 * Math.sin(x * 27 + 1.4) + (r() - 0.5) * 0.07);
    } else {
      /* 머물다 이동하면 0 으로 떨어지는 체류 시간 */
      if (hold <= 0) { hold = 4 + Math.floor(r() * 12); cur = 0; }
      cur += (0.86 / hold) * (0.7 + r() * 0.6);
      hold -= 1;
      v.push(Math.min(cur, 0.94));
    }
  }

  const lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  return v.map((y, i) => {
    const px = (i / (N - 1)) * W;
    const py = H - PAD - ((y - lo) / span) * (H - PAD * 2);
    return (i ? 'L' : 'M') + px.toFixed(1) + ' ' + py.toFixed(1);
  }).join('');
}

    const D = [
      ['청년층', '15–29세', 21.6, 15.7],

    /* viewBox 폭 740 = 스텝 도해 렌더 폭. 배율 ≈ 1 이라 좌표가 곧 화면 px 다 */
    const W = 740, H = 320, L = 44, R = 12, T = 46, B = 52;
    const pw = W - L - R, ph = H - T - B, max = 40;
    const y = (v) => T + ph - (v / max) * ph;
    /* 하이픈이 아니라 마이너스 기호(U+2212). 자릿수 폭이 숫자와 맞는다 */
    const pp = (n) => (n < 0 ? '–' : '+') + Math.abs(n).toFixed(1) + '%p';
    const gw = pw / D.length, bw = Math.min(40, gw * 0.26);

    const ticks = [0, 10, 20, 30, 40].map((t) =>
      `<line class="grid" x1="${L}" y1="${y(t)}" x2="${W - R}" y2="${y(t)}"/>
       <text class="t-ax" x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}%</text>`).join('');

    const groups = D.map(([name, sub, a, b], i) => {
      const cx = L + gw * i + gw / 2;
      const up = b > a;
      return `
        <rect class="b-old" x="${cx - bw - 4}" y="${y(a)}" width="${bw}" height="${ph - (y(a) - T)}"/>
        <rect class="b-new" x="${cx + 4}" y="${y(b)}" width="${bw}" height="${ph - (y(b) - T)}"/>

        <text class="t-val${up ? ' is-hi' : ''}" x="${cx + bw / 2 + 4}" y="${y(b) - 6}" text-anchor="middle">${b}</text>
        <text class="t-d${up ? ' is-up' : ''}" x="${cx}" y="${T - 16}" text-anchor="middle">${pp(b - a)}</text>
        <text class="t-ax" x="${cx}" y="${H - B + 22}" text-anchor="middle">${name}</text>
        ${sub ? `<text class="t-ax" x="${cx}" y="${H - B + 38}" text-anchor="middle">${sub}</text>` : ''}`;
    }).join('');

    return `
      <div class="fg">
        <div class="fg__hd">
          <p class="fg__t">10년 동안 30대는 7.3%p 줄고 50대 이상은 14.4%p 늘었다</p>

          <thead><tr><th>연령대</th><th>2010년</th><th>2020년</th><th>증감</th></tr></thead>

  /* ── 정책 학습 ── 기획서 crop_rl_policy ── */
  rlpolicy: () => {
    /* 감쇠 곡선 — 학습이 진행될수록 검증 오차가 줄어든다.
       형태 예시다. 회차별 오차 실측값은 기획서에 없다 */
    const W = 200, H = 40, N = 40;
    const pts = Array.from({ length: N }, (_, i) => {
      const t = i / (N - 1);
      const x = t * W;
      /* SVG 의 y 는 아래로 늘어난다. 오차가 줄어드는 곡선이므로
         왼쪽이 위(작은 y), 오른쪽이 아래(큰 y)여야 한다 */
      const y = 4 + (H - 8) * (1 - Math.exp(-3.1 * t));
      return x.toFixed(1) + ' ' + y.toFixed(1);
    });
    const line = 'M' + pts.join('L');
    return `
      <div class="fg">
        <div class="fg__hd">
          <p class="fg__t">48개 환경에서 보상을 최대화하는 정책을 학습한다</p>

          <div class="rl__curve">
            <svg viewBox="0 0 ${W} ${H}" role="img" preserveAspectRatio="none"
                 aria-label="학습 회차가 늘수록 숙련공 대비 검증 오차가 가파르게 줄다가 완만해지는 감쇠 곡선. 형태 예시이며 회차별 실측값은 아니다.">
              <path class="fl" d="${line}L${W} ${H}L0 ${H}Z"/>
              <path class="ln" d="${line}"/>
            </svg>
            <p>학습이 진행될수록 숙련공 대비 검증 오차 ↓ — 곡선은 형태 예시다</p>

(function () {
  const slug = new URLSearchParams(location.search).get('p') || 'polishing';
  const page = PAGES[slug] || PAGES.polishing;

  document.title = page.title + ' — PolyTwin';
  /* 슬러그 15종이 같은 설명을 달고 나가지 않게 — 리드문을 그대로 쓴다 */
  if (page.lede) document.querySelector('meta[name="description"]')?.setAttribute('content', page.lede);
  document.getElementById('crumbGroup').textContent = page.group;
  document.getElementById('crumbPage').textContent = page.title;
  document.getElementById('pageTitle').textContent = page.title;
  document.getElementById('pageLede').textContent = page.lede || '';

  /* 메뉴에서 현재 페이지 표시 + 해당 그룹 펼침 */
  document.querySelectorAll('.m-sub a').forEach((a) => {
    if (a.getAttribute('href') === 'sub.html?p=' + slug) {
      a.setAttribute('aria-current', 'page');
      a.closest('.m-group').open = true;
    }
  });

  const body = document.getElementById('pageBody');
  /* 구간이 있으면 #t= 로 알려준다 — 브라우저가 그 지점부터 Range 로 받아온다.
     끝 지점 강제는 아래 재생 스크립트가 맡는다 (브라우저마다 편차가 있다) */
  const videoTag = (f, cls) => {
    const [vw, vh] = f.dim;
    const frag = f.start != null ? '#t=' + f.start + (f.end != null ? ',' + f.end : '') : '';
    const win = f.start != null ? ` data-start="${f.start}"` + (f.end != null ? ` data-end="${f.end}"` : '') : '';
    /* 구간 반복은 스크립트가 한다. loop 속성과 겹치면 브라우저마다 다르게 논다 */
    const tag = `<video class="${cls}" src="${f.vid}${frag}" width="${vw}" height="${vh}"${win}` +
      (f.start == null ? ' loop' : '') +
      ` controls muted playsinline preload="metadata" aria-label="${esc(f.cap)}"></video>`;
    if (!f.crop) return tag;
    /* 남길 영역 기준으로 비율을 잡고, 영상을 그만큼 키워 밀어넣는다.
       퍼센트는 컨테이너 기준이라 어떤 폭에서도 같은 자리가 잘린다 */
    const [cl, ct, cr, cb] = f.crop;
    const kw = vw - cl - cr, kh = vh - ct - cb;
    return `<div class="vcrop" style="` +
      `aspect-ratio:${kw}/${kh};` +
      `--vw:${(vw / kw) * 100}%;--vh:${(vh / kh) * 100}%;` +
      `--vx:${(-cl / kw) * 100}%;--vy:${(-ct / kh) * 100}%">${tag}</div>`;
  };
  const esc = (s) => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  let html = '';

  if (page.stats) {
    html += '<section class="stats" aria-label="핵심 수치"><div class="stats__grid">' +
      page.stats.map(([v, u, l]) =>
        `<div><span class="stats__v">${esc(v)}<small>${esc(u)}</small></span><span class="label">${esc(l)}</span></div>`
      ).join('') + '</div></section>';
  }

  /* 공정을 문장으로 쪼개기 전에 실제로 어떻게 도는지 한 번 보여준다 */
  if (page.video) {
    const v = page.video;
    const dur = v.start != null && v.end != null ? Math.round(v.end - v.start) + '초 구간 반복' : '';
    html += `<figure class="lead">${videoTag(v, '')}` +
      `<figcaption><b>${esc(v.cap)}</b>${dur ? `<span>${dur}</span>` : ''}</figcaption></figure>`;
  }

  /* 본문 폭을 다 쓰는 도해 띠. 네이티브 도해(FIG)와 기획서 도해(IMG)를
     같이 받고, 한 장도 여러 장도 받는다.
     frame 은 단계 앞 — 범위를 먼저 밝힌다.
     detail 은 단계 뒤 — 단계를 읽은 뒤에 보는 상세다 */
  const band = (src, label) => {
    if (!src) return '';
    return `<section class="frame" aria-label="${label}">` + [].concat(src).map((f) => {
      /* cap 이 비면 캡션 줄을 아예 만들지 않는다 — 도해가 스스로 제목을 달고 있는 경우다 */
      const cap = f.cap ? `<figcaption>${esc(f.cap)}</figcaption>` : '';
      if (f.fig) return `<figure class="p-fig p-fig--wide">${FIGS[f.fig]()}${cap}</figure>`;
      if (f.vid) return `<figure class="p-fig p-fig--wide">${videoTag(f, '')}${cap}</figure>`;
      const [w, h] = f.dim || [1200, 800];
      /* 세로가 긴 그림까지 띠 폭을 다 주면 좌우가 전부 레터박스가 된다 */
      const tall = h > w ? ' p-fig--tall' : '';
      return `<figure class="p-fig p-fig--wide${tall}">` +
        `<img src="${f.img}" alt="${esc(f.cap || label)}" loading="lazy" width="${w}" height="${h}">${cap}</figure>`;
    }).join('') + `</section>`;
  };
  html += band(page.frame, '개요 도해');

  if (page.steps) {
    html += '<section class="proc" aria-label="프로세스">' + page.steps.map((s, i) => {
      const no = String(i + 1).padStart(2, '0');
      const [w, h] = s.f.dim || [1200, 800];   /* img 경로에서만 쓴다 */
      /* band() 와 같은 규칙 — cap 이 비면 캡션 줄을 만들지 않는다.
         도해가 스스로 제목을 달고 있으면 아래 한 줄은 같은 말의 반복이다 */
      const sCap = s.f.cap ? `<figcaption>${esc(s.f.cap)}</figcaption>` : '';
      const fig = s.f.fig
        /* 네이티브 도해 — 마크업이라 캡션도 텍스트로 붙는다 */
        ? `<figure class="p-fig">${FIGS[s.f.fig]()}${sCap}</figure>`
        : s.f.vid
        /* 자동재생은 붙이지 않는다. 아래에서 reduced-motion 을 보고 정한다.
           controls 는 항상 둔다 — 움직이는 것은 멈출 수 있어야 한다 */
        ? `<figure class="p-fig">${videoTag(s.f, '')}${sCap}</figure>`
        : s.f.img
        ? `<figure class="p-fig"><img src="${s.f.img}" alt="${esc(s.f.cap || s.t)}" loading="lazy" width="${w}" height="${h}">` +
          `${sCap}</figure>`
        : `<figure class="p-fig"><div class="ph"><span class="label">${esc(s.f.ph)}</span></div></figure>`;
      return `<article class="p-step">
        <div class="p-txt">
          <span class="p-no"><b>${no}</b><span class="label">Process</span></span>
          <h2>${esc(s.t)}</h2>
          <p>${esc(s.d)}</p>
          <ul>${s.b.map((x) => `<li>${x}</li>`).join('')}</ul>
        </div>
        ${fig}
      </article>`;
    }).join('') + '</section>';
  }

  html += band(page.detail, '상세 도해');

  /* 게시물 목록 — News · Blog. 날짜는 세로로 정렬되므로 tabular-nums (CSS) */
  if (page.posts) {
    html += '<section class="posts" aria-label="게시물">' + page.posts.map(([d, t, x]) =>
      `<article class="post"><time datetime="${d}">${d}</time><h2>${esc(t)}</h2><p>${esc(x)}</p></article>`
    ).join('') + '</section>';
  }

  /* 문답 — 질문을 한 번에 다 펼치지 않는다 */
  if (page.qa) {
    html += '<section class="qa" aria-label="자주 묻는 질문">' + page.qa.map(([q, a]) =>
      `<details><summary>${esc(q)}</summary><p class="qa__a">${esc(a)}</p></details>`
    ).join('') + '</section>';
  }

  if (page.empty) {
    html += `<section class="empty">
      <h2>${esc(page.title)}</h2>
      <p>${esc(page.empty)}</p>
      <a class="btn btn--ghost" href="index.html">홈으로 돌아가기</a>
    </section>`;
  }

  html += `<div class="next">
    <a class="btn btn--ghost" href="index.html">홈으로</a>
    <a class="btn btn--ghost" href="console.html">콘솔 열기</a>
  </div>`;

  body.innerHTML = html;

  /* ── 영상 ──────────────────────────────────────────────────
     화면에 들어오면 틀고 벗어나면 멈춘다. 페이지를 열자마자
     아래쪽 영상까지 재생하면 대역폭만 쓰고 아무도 안 본다.
     ──────────────────────────────────────────────────────── */
  const vids = body.querySelectorAll('video');
  if (vids.length) {
    const still = window.matchMedia('(prefers-reduced-motion: reduce)');

    /* 구간 반복 — 3분짜리 원본에서 필요한 20초만 돈다.
       #t= 만으로는 끝 지점을 지키지 않는 브라우저가 있어서 여기서 강제한다 */
    vids.forEach((v) => {
      const a = parseFloat(v.dataset.start);
      if (Number.isNaN(a)) return;
      const b = parseFloat(v.dataset.end);
      const rewind = () => { if (v.currentTime < a - 0.25 || (b && v.currentTime >= b)) v.currentTime = a; };
      if (v.readyState >= 1) rewind(); else v.addEventListener('loadedmetadata', rewind, { once: true });
      if (b) v.addEventListener('timeupdate', () => { if (v.currentTime >= b) v.currentTime = a; });
    });

    /* 화면에 들어오면 틀고 벗어나면 멈춘다. 페이지를 열자마자 아래쪽
       영상까지 재생하면 대역폭만 쓰고 아무도 안 본다.*/
    const io = 'IntersectionObserver' in window && new IntersectionObserver((rows) => {
      rows.forEach((row) => {
        const v = row.target;
        if (row.isIntersecting && !still.matches) {
          v.muted = true;                 /* 정책상 무음이어야 자동재생된다 */
          v.play().catch(() => {});       /* 막히면 controls 로 틀면 된다 */
        } else if (!v.paused) {
          v.pause();
        }
      });
    }, { threshold: 0.4 });
    vids.forEach((v) => { if (io) io.observe(v); });

    /* 중간에 설정을 바꾸면 즉시 따른다 */
    still.addEventListener('change', () => {
      if (still.matches) vids.forEach((v) => v.pause());
    });
  }
})();
</script>

    "three/addons/": "./assets/vendor/"

<!-- ══════════════════════════════════════════════════════════════

     이 페이지의 나머지 도해는 전부 마크업이다. three.js 는 #rb-stage
     가 실제로 있을 때만 import 한다 — 다른 하위 페이지에서는
     벤더 코드를 아예 받지 않는다.

     카메라는 바운딩 스피어로 자동 프레이밍한다. 모델 스케일이 화면마다
     다르므로 고정 좌표를 쓰면 안 된다.
     ══════════════════════════════════════════════════════════════ -->
<script type="module">
(async () => {
  const stage = document.getElementById('rb-stage');
  if (!stage) return;                       /* 다른 페이지면 여기서 끝 */

  const ph = document.getElementById('rb-ph');
  const fail = (why) => {
    if (ph) ph.innerHTML = '<b>로봇 팔을 불러오지 못했다</b><span>' + why + '</span>';
  };

  let THREE, GLTFLoader, MeshoptDecoder;
  try {
    THREE = await import('three');
    ({ GLTFLoader } = await import('three/addons/loaders/GLTFLoader.js'));
    ({ MeshoptDecoder } = await import('./assets/vendor/meshopt_decoder.mjs'));
  } catch (e) {
    fail('WebGL 모듈을 읽지 못했다');
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
  /* 이 셋은 빼먹으면 즉시 티가 난다 —*/
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.setClearColor(0x000000, 0);

  const scene = new THREE.Scene();

  /* 환경맵 — 없으면 금속이 금속이 아니다.
     밝은 띠 몇 개짜리 최소 스튜디오. 곡면이 각도를 훑으므로 낮은 앙각을 덮는다 */
  const envScene = new THREE.Scene();
  const panel = (x, y, z, w, h, i) => {
    const m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    m.material.color.multiplyScalar(i);
    m.position.set(x, y, z);
    m.lookAt(0, 0, 0);
    envScene.add(m);
  };
  envScene.background = new THREE.Color(0x0b0d10);
  panel(-3, 3.2, 2.5, 6, 3, 2.6);
  panel(3.4, 1.6, -2.2, 5, 2.4, 1.5);
  panel(0, 1.0, 4.2, 5, 2.0, 1.1);
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene, 0.03).texture;

  const camera = new THREE.PerspectiveCamera(34, 1, 0.01, 100);

  /* 키 1 + 좌우 림 2, 강한 명암 대비 — 형상보다 조명이 중요하다 */
  const key = new THREE.DirectionalLight(0xffffff, 3.0);
  key.position.set(2.4, 6.5, 3.2);
  const rimL = new THREE.DirectionalLight(0xbcd4ff, 1.5);
  rimL.position.set(-7, 3.4, -4.5);
  const rimR = new THREE.DirectionalLight(0xffd9c2, 1.1);
  rimR.position.set(7.5, 2.6, -3.5);
  const hemi = new THREE.HemisphereLight(0x8496ad, 0x080a0d, 0.5);
  scene.add(key, rimL, rimR, hemi);

  const pivot = new THREE.Group();
  scene.add(pivot);

  let gltf;
  try {
    gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)
      .loadAsync('./assets/models/robot_arm.opt.glb');
  } catch (e) {
    fail('모델 파일을 읽지 못했다');
    return;
  }

  const arm = gltf.scene;
  /* 바운딩 스피어 기준 자동 프레이밍. 모델 스케일이 3자릿수 넘게
     차이나므로 고정 좌표를 쓰면 안 된다 */
  const box = new THREE.Box3().setFromObject(arm);
  const sph = box.getBoundingSphere(new THREE.Sphere());
  arm.position.sub(sph.center);             /* 원점으로 끌어온다 */
  pivot.add(arm);

  const fit = sph.radius / Math.sin((camera.fov * Math.PI) / 360);
  camera.position.set(fit * 0.62, fit * 0.42, fit * 0.72);
  camera.lookAt(0, 0, 0);
  camera.near = fit / 100;
  camera.far = fit * 12;
  camera.updateProjectionMatrix();

  stage.appendChild(renderer.domElement);
  if (ph) ph.remove();

  const resize = () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  };
  resize();
  addEventListener('resize', resize);

  /* 모션 정지 — 예외 없음. 정지 상태에서도 한 프레임은 그린다 */
  const still = matchMedia('(prefers-reduced-motion: reduce)');
  let raf = 0, spinning = false;
  const draw = () => renderer.render(scene, camera);
  const tick = () => { pivot.rotation.y += 0.0022; draw(); raf = requestAnimationFrame(tick); };
  const stop = () => { cancelAnimationFrame(raf); raf = 0; spinning = false; };
  const start = () => {
    if (raf || still.matches) { draw(); return; }
    spinning = true; tick();
  };

  /* 화면 밖이면 돌리지 않는다 — 안 보이는 캔버스에 GPU 를 쓰지 않는다 */
  const io = 'IntersectionObserver' in window
    ? new IntersectionObserver((rows) => {
        rows.forEach((r) => (r.isIntersecting ? start() : stop()));
      }, { threshold: 0.15 })
    : null;
  io ? io.observe(stage) : start();

  still.addEventListener('change', () => { if (still.matches) { stop(); draw(); } });
})();
</script>
